<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- 学校标记背景 -->
  <circle cx="16" cy="16" r="15" fill="#1890ff" stroke="#ffffff" stroke-width="2"/>
  
  <!-- 学校建筑图标 -->
  <g fill="#ffffff" transform="translate(8, 8)">
    <!-- 主体建筑 -->
    <rect x="2" y="8" width="12" height="8" rx="1"/>
    <!-- 屋顶 -->
    <polygon points="1,8 8,4 15,8"/>
    <!-- 门 -->
    <rect x="6" y="11" width="4" height="5" fill="#1890ff"/>
    <!-- 旗杆 -->
    <line x1="14" y1="2" x2="14" y2="8" stroke="#ff4d4f" stroke-width="1"/>
    <!-- 旗帜 -->
    <polygon points="14,2 14,5 11,4" fill="#ff4d4f"/>
  </g>
  
  <!-- 定位点 -->
  <circle cx="16" cy="16" r="2" fill="#ffffff"/>
</svg>